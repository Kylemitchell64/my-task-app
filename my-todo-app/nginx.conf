server {
  listen 80;
  root /usr/share/nginx/html;

  # The app is a single page: unknown paths fall back to it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted files never change, so browsers can keep them.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # These must always be fresh or the app cannot update itself.
  location ~* ^/(sw\.js|index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # The API, its OAuth return addresses and its health check.
  location ~ ^/(api/|signin-|healthz) {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
