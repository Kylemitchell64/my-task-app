name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build projects.sln --configuration Release
      - name: Test against PostgreSQL
        run: dotnet test projects.sln --configuration Release --no-build
        env:
          TEST_DATABASE: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

  web:
    name: Frontend lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-todo-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-todo-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (real API and database)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: my-todo-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-todo-app/package-lock.json
      - run: npm ci
      # The runner image already has the system libraries Chromium needs, so only the
      # browser itself is downloaded. Retried once because downloads occasionally flake.
      - name: Install Chromium
        run: npx playwright install chromium || npx playwright install chromium
      - name: Build the API ahead of time
        run: dotnet build ../TodoApi
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: my-todo-app/playwright-report
          retention-days: 7
