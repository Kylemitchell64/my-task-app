# Copy to secrets.yaml (which git ignores), fill in real values, then:
#   kubectl apply -f k8s/base/secrets.yaml
# Never commit the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  postgres-password: "CHANGE_ME"
  connection-string: "Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # Generate with: openssl rand -base64 64
  jwt-key: "CHANGE_ME"
  # The public address of the frontend, with no trailing slash.
  frontend-url: "https://example.com"
  # Optional sign-in providers. Delete the pairs you do not use.
  google-client-id: ""
  google-client-secret: ""
  github-client-id: ""
  github-client-secret: ""
